<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Neverland – Le Monde Imaginaire</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Quicksand:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="stars-container"></div>
  <div id="shooting-stars"></div>
  <div id="glow"></div>

  <div id="app">
    <section class="hero-banner">
      <div class="hero-glow"></div>
      <p class="hero-eyebrow">✨ Bienvenue</p>
      <h1 class="hero-title">Le Monde Imaginaire</h1>
      <p class="hero-tagline">Ne grandis jamais</p>
      <div class="hero-line"></div>
    </section>

    <header class="header">
      <div class="logo">
        <span class="logo-icon">🌙</span>
        <h2>Neverland</h2>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab active" data-tab="tout">Tout</button>
      <button class="tab" data-tab="cart">
        Panier
        <span class="cart-count" id="cart-count">0</span>
      </button>
    </nav>

    <main id="main">
      <section id="catalog" class="section active">
        <div class="products-grid" id="products-grid"></div>
      </section>

      <section id="cart-section" class="section">
        <div id="cart-empty" class="empty-state">
          <div class="empty-icon">🌙</div>
          <p>Ton panier est vide…</p>
          <p class="empty-sub">Choisis quelque chose de magique</p>
        </div>

        <div id="cart-content" class="hidden">
          <div id="cart-items"></div>

          <div class="delivery-box">
            <div class="delivery-title">Mode de récupération</div>
            <div class="delivery-options">
              <label class="radio-card">
                <input type="radio" name="delivery" value="pickup" checked />
                <span class="radio-content">
                  <span class="radio-icon">🏠</span>
                  <span>Retrait sur place</span>
                </span>
              </label>
              <label class="radio-card">
                <input type="radio" name="delivery" value="delivery" />
                <span class="radio-content">
                  <span class="radio-icon">🚚</span>
                  <span>Livraison (+10 €)</span>
                </span>
              </label>
            </div>

            <div id="delivery-fields" class="hidden">
              <p class="delivery-fee-note">🚚 Frais de livraison : <strong>10,00 €</strong> ajoutés au total</p>
              <div class="form-group">
                <label>Pseudo Telegram</label>
                <input type="text" id="tg-username" placeholder="@tonpseudo" autocomplete="off" />
              </div>
              <div class="form-group">
                <label>Adresse complète</label>
                <textarea id="address" rows="3" placeholder="Numéro, rue, code postal, ville…"></textarea>
              </div>
            </div>
          </div>

          <div class="total-box">
            <div class="total-lines">
              <div class="total-row">
                <span>Sous-total</span>
                <span id="subtotal-price">0,00 €</span>
              </div>
              <div class="total-row hidden" id="delivery-fee-row">
                <span>Livraison</span>
                <span>10,00 €</span>
              </div>
              <div class="total-row total-final">
                <span>Total à payer en espèces</span>
                <strong id="total-price">0,00 €</strong>
              </div>
            </div>
          </div>

          <button id="submit-order" class="btn-primary" disabled>Commander ✨</button>
          <p class="cash-note">Paiement uniquement en espèces</p>
        </div>
      </section>
    </main>

    <!-- Modal produit -->
    <div id="product-modal" class="modal hidden">
      <div class="modal-backdrop" id="modal-backdrop"></div>
      <div class="modal-sheet">
        <button class="modal-close" id="modal-close">✕</button>
        <div id="modal-body"></div>
      </div>
    </div>

    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
