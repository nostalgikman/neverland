<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neverland – Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a1a;
      --card: rgba(22, 22, 45, 0.95);
      --gold: #e8c872;
      --text: #f0eaf8;
      --muted: #a89bc0;
      --border: rgba(232, 200, 114, 0.3);
      --danger: #e87a7a;
      --success: #7dcea0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Quicksand', system-ui, sans-serif;
      background: radial-gradient(ellipse at top, #1a1040 0%, #0a0a1a 70%);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
    }
    h1, h2 { font-family: 'Cinzel', serif; color: var(--gold); }
    .container { max-width: 900px; margin: 0 auto; }

    /* Login */
    #login-screen {
      max-width: 360px;
      margin: 80px auto;
      background: var(--card);
      padding: 32px;
      border-radius: 20px;
      border: 1px solid var(--border);
      text-align: center;
    }
    #login-screen h1 { margin-bottom: 8px; }
    #login-screen p { color: var(--muted); margin-bottom: 24px; font-size: 0.9rem; }
    input[type="password"], input[type="text"], input[type="number"], textarea, select {
      width: 100%;
      padding: 12px 14px;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      color: var(--text);
      font-family: inherit;
      font-size: 1rem;
      margin-bottom: 12px;
      outline: none;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--gold); }
    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      border-radius: 12px;
      padding: 12px 20px;
      font-weight: 600;
      font-size: 0.95rem;
    }
    .btn-gold {
      background: linear-gradient(135deg, #c9a84c, #e8c872);
      color: #1a1040;
      width: 100%;
    }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--gold);
    }
    .btn-danger {
      background: rgba(232, 122, 122, 0.2);
      border: 1px solid var(--danger);
      color: var(--danger);
    }
    .btn-small { padding: 7px 12px; font-size: 0.85rem; }

    /* Admin main */
    #admin-screen { display: none; }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    .tab {
      background: rgba(255,255,255,0.05);
      border: 1px solid transparent;
      color: var(--muted);
      padding: 10px 18px;
      border-radius: 12px;
    }
    .tab.active {
      background: rgba(232, 200, 114, 0.15);
      border-color: var(--border);
      color: var(--gold);
    }

    .card {
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 14px;
    }
    .product-row {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      flex-wrap: wrap;
    }
    .product-emoji {
      font-size: 2rem;
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(232,200,114,0.1);
      border-radius: 12px;
      flex-shrink: 0;
    }
    .product-info { flex: 1; min-width: 180px; }
    .product-name { font-weight: 600; margin-bottom: 2px; }
    .product-meta { font-size: 0.85rem; color: var(--muted); }
    .product-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    @media (max-width: 600px) {
      .form-grid { grid-template-columns: 1fr; }
    }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .full { grid-column: 1 / -1; }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-on { background: rgba(125,206,160,0.2); color: var(--success); }
    .badge-off { background: rgba(232,122,122,0.2); color: var(--danger); }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--card);
      border: 1px solid var(--border);
      padding: 12px 20px;
      border-radius: 12px;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 100;
    }
    .toast.show { opacity: 1; }

    .order-item {
      font-size: 0.9rem;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .order-item:last-child { border-bottom: none; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Login -->
    <div id="login-screen">
      <h1>✨ Neverland</h1>
      <p>Espace administrateur</p>
      <input type="password" id="admin-password" placeholder="Mot de passe admin" />
      <button class="btn-gold" onclick="login()">Entrer</button>
      <p id="login-error" style="color:var(--danger);margin-top:12px;font-size:0.85rem;"></p>
    </div>

    <!-- Admin -->
    <div id="admin-screen">
      <div class="header">
        <h1>✨ Neverland Admin</h1>
        <button class="btn-outline btn-small" onclick="logout()">Déconnexion</button>
      </div>

      <div class="tabs">
        <button class="tab active" data-tab="products" onclick="switchTab('products')">Produits</button>
        <button class="tab" data-tab="orders" onclick="switchTab('orders')">Commandes</button>
        <button class="tab" data-tab="add" onclick="switchTab('add')">+ Ajouter</button>
        <button class="tab" data-tab="categories" onclick="switchTab('categories')">Catégories</button>
        <button class="tab" data-tab="settings" onclick="switchTab('settings')">Fidélité</button>
      </div>

      <!-- Liste produits -->
      <div id="tab-products">
        <div id="products-list"></div>
      </div>

      <!-- Commandes -->
      <div id="tab-orders" style="display:none;">
        <div id="orders-list"></div>
      </div>


      <!-- Catégories -->
      <div id="tab-categories" style="display:none;">
        <div class="card">
          <h2 style="margin-bottom:8px;">Catégories</h2>
          <p style="color:var(--muted);font-size:0.9rem;margin-bottom:16px;">
            Change les noms affichés dans la mini app. Les produits sont liés à l’identifiant (id).
          </p>
          <div id="categories-list"></div>
          <button class="btn-outline" style="margin-top:12px;width:100%;" onclick="addCategoryRow()">+ Nouvelle catégorie</button>
          <button class="btn-gold" style="margin-top:10px;width:100%;" onclick="saveCategories()">Enregistrer les catégories</button>
        </div>
      </div>

      <!-- Paramètres fidélité -->
      <div id="tab-settings" style="display:none;">
        <div class="card">
          <h2 style="margin-bottom:16px;">Système de fidélité</h2>
          <div class="form-grid">
            <div class="form-group">
              <label>Points gagnés par commande</label>
              <input type="number" id="s-points-per-order" min="1" value="5" />
            </div>
            <div class="form-group">
              <label>Points nécessaires pour l'offre</label>
              <input type="number" id="s-points-for-reward" min="1" value="30" />
            </div>
            <div class="form-group full">
              <label>Description de l'offre (ex: 1 article offert, 1 bouquet offert...)</label>
              <input type="text" id="s-reward-label" value="1 article offert" />
            </div>
          </div>
          <button class="btn-gold" style="margin-top:16px;width:100%;" onclick="saveSettings()">Enregistrer les paramètres</button>
        </div>
      </div>

      <!-- Formulaire ajout / édition -->
      <div id="tab-add" style="display:none;">
        <div class="card">
          <h2 id="form-title" style="margin-bottom:16px;">Nouveau produit</h2>
          <input type="hidden" id="edit-id" value="" />
          <div class="form-grid">
            <div class="form-group">
              <label>Nom</label>
              <input type="text" id="f-name" placeholder="Ex: Chocolat noir 70%" />
            </div>
            <div class="form-group">
              <label>Catégorie</label>
              <select id="f-category"></select>
            </div>
            <div class="form-group">
              <label>Prix (nombre)</label>
              <input type="number" id="f-price" step="0.01" min="0" placeholder="0.50" />
            </div>
            <div class="form-group">
              <label>Unité (ex: € / g)</label>
              <input type="text" id="f-unit" placeholder="€ / g" value="€ / g" />
            </div>
            <div class="form-group">
              <label>Emoji</label>
              <input type="text" id="f-emoji" placeholder="🍫" />
            </div>
            <div class="form-group full">
              <label>Photo (depuis ta galerie)</label>
              <input type="file" id="f-file" accept="image/*" />
              <input type="hidden" id="f-image" value="" />
              <div id="f-preview" style="margin-top:8px;"></div>
            </div>
            <div class="form-group full">
              <label>Description</label>
              <textarea id="f-desc" rows="3" placeholder="Description du produit..."></textarea>
            </div>
            <div class="form-group">
              <label>Actif</label>
              <select id="f-active">
                <option value="1">Oui (visible)</option>
                <option value="0">Non (caché)</option>
              </select>
            </div>
            <div class="form-group">
              <label>Ordre d’affichage</label>
              <input type="number" id="f-sort" value="0" />
            </div>
          </div>
          <div style="display:flex;gap:10px;margin-top:16px;">
            <button class="btn-gold" onclick="saveProduct()" style="flex:1;">Enregistrer</button>
            <button class="btn-outline" onclick="resetForm()">Annuler</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    let adminPassword = localStorage.getItem('neverland_admin_pwd') || '';

    async function api(path, options = {}) {
      const headers = {
        'Content-Type': 'application/json',
        'X-Admin-Password': adminPassword,
        ...options.headers
      };
      const res = await fetch(path, { ...options, headers });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Erreur');
      return data;
    }

    async function login() {
      const pwd = document.getElementById('admin-password').value;
      try {
        await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pwd })
        }).then(r => {
          if (!r.ok) throw new Error('Mot de passe incorrect');
          return r.json();
        });
        adminPassword = pwd;
        localStorage.setItem('neverland_admin_pwd', pwd);
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('admin-screen').style.display = 'block';
        loadProducts();
        loadOrders();
        loadSettings();
      } catch (e) {
        document.getElementById('login-error').textContent = e.message;
      }
    }

    function logout() {
      adminPassword = '';
      localStorage.removeItem('neverland_admin_pwd');
      location.reload();
    }

    // Auto-login si déjà connecté
    if (adminPassword) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('admin-screen').style.display = 'block';
      loadProducts();
      loadOrders();
      loadSettings();
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
      document.getElementById('tab-products').style.display = tab === 'products' ? 'block' : 'none';
      document.getElementById('tab-orders').style.display = tab === 'orders' ? 'block' : 'none';
      document.getElementById('tab-add').style.display = tab === 'add' ? 'block' : 'none';
      document.getElementById('tab-categories').style.display = tab === 'categories' ? 'block' : 'none';
      document.getElementById('tab-settings').style.display = tab === 'settings' ? 'block' : 'none';
      if (tab === 'add') { fillCategorySelect(); resetForm(); }
      if (tab === 'settings') loadSettings();
      if (tab === 'categories') loadCategoriesAdmin();
    }

    async function loadProducts() {
      try {
        const products = await api('/api/admin/products');
        const list = document.getElementById('products-list');
        if (products.length === 0) {
          list.innerHTML = '<p style="color:var(--muted);text-align:center;padding:40px;">Aucun produit</p>';
          return;
        }
        list.innerHTML = products.map(p => `
          <div class="card">
            <div class="product-row">
              <div class="product-emoji">${p.image_emoji || '🎁'}</div>
              <div class="product-info">
                <div class="product-name">${escapeHtml(p.name)}</div>
                <div class="product-meta">
                  ${p.price} ${escapeHtml(p.unit || '€')} · ${p.category}
                  <span class="badge ${p.active ? 'badge-on' : 'badge-off'}">${p.active ? 'Actif' : 'Caché'}</span>
                </div>
                <div class="product-meta" style="margin-top:4px;">${escapeHtml(p.description || '')}</div>
              </div>
              <div class="product-actions">
                <button class="btn-outline btn-small" onclick='editProduct(${JSON.stringify(p)})'>Modifier</button>
                <button class="btn-danger btn-small" onclick="deleteProduct(${p.id})">Supprimer</button>
              </div>
            </div>
          </div>
        `).join('');
      } catch (e) {
        showToast(e.message);
      }
    }

    async function editProduct(p) {
      await fillCategorySelect(p.category);
      document.getElementById('edit-id').value = p.id;
      document.getElementById('f-name').value = p.name;
      document.getElementById('f-category').value = p.category;
      document.getElementById('f-price').value = p.price;
      document.getElementById('f-unit').value = p.unit || '€ / g';
      document.getElementById('f-emoji').value = p.image_emoji || '';
      document.getElementById('f-image').value = p.image_url || '';
      document.getElementById('f-preview').innerHTML = p.image_url
        ? `<img src="${p.image_url}" style="max-width:120px;border-radius:12px;" />` : '';
      document.getElementById('f-desc').value = p.description || '';
      document.getElementById('f-active').value = p.active ? '1' : '0';
      document.getElementById('f-sort').value = p.sort_order || 0;
      document.getElementById('form-title').textContent = 'Modifier le produit';
      switchTab('add');
    }

    function resetForm() {
      document.getElementById('edit-id').value = '';
      document.getElementById('f-name').value = '';
      const sel = document.getElementById('f-category');
      if (sel.options.length) sel.selectedIndex = 0;
      document.getElementById('f-price').value = '';
      document.getElementById('f-unit').value = '€ / g';
      document.getElementById('f-emoji').value = '';
      document.getElementById('f-image').value = '';
      document.getElementById('f-file').value = '';
      document.getElementById('f-preview').innerHTML = '';
      document.getElementById('f-desc').value = '';
      document.getElementById('f-active').value = '1';
      document.getElementById('f-sort').value = '0';
      document.getElementById('form-title').textContent = 'Nouveau produit';
    }

    let adminCategories = [];

    async function fillCategorySelect(selected) {
      try {
        adminCategories = await api('/api/admin/categories');
      } catch (e) {
        adminCategories = [
          { id: 'chocolat', label: 'Chocolat' },
          { id: 'fleurs', label: 'Fleurs' },
          { id: 'poudre', label: 'Poudre' }
        ];
      }
      const sel = document.getElementById('f-category');
      sel.innerHTML = adminCategories.map(c =>
        `<option value="${c.id}" ${selected === c.id ? 'selected' : ''}>${c.emoji || ''} ${c.label}</option>`
      ).join('');
    }

    async function loadCategoriesAdmin() {
      try {
        adminCategories = await api('/api/admin/categories');
        renderCategoriesAdmin();
      } catch (e) {
        showToast(e.message);
      }
    }

    function renderCategoriesAdmin() {
      const box = document.getElementById('categories-list');
      box.innerHTML = adminCategories.map((c, i) => `
        <div class="form-grid" style="margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,0.08);" data-idx="${i}">
          <div class="form-group">
            <label>Identifiant (technique)</label>
            <input type="text" class="cat-id" value="${escapeHtml(c.id)}" data-old="${escapeHtml(c.id)}" />
          </div>
          <div class="form-group">
            <label>Nom affiché</label>
            <input type="text" class="cat-label" value="${escapeHtml(c.label)}" />
          </div>
          <div class="form-group">
            <label>Emoji</label>
            <input type="text" class="cat-emoji" value="${escapeHtml(c.emoji || '')}" />
          </div>
          <div class="form-group">
            <label>Ordre</label>
            <input type="number" class="cat-sort" value="${c.sort || i + 1}" />
          </div>
          <button class="btn-outline" type="button" onclick="removeCategoryRow(${i})" style="grid-column:1/-1;">Supprimer</button>
        </div>
      `).join('') || '<p style="color:var(--muted);">Aucune catégorie</p>';
    }

    function addCategoryRow() {
      adminCategories.push({ id: 'nouvelle', label: 'Nouvelle', emoji: '✨', sort: adminCategories.length + 1 });
      renderCategoriesAdmin();
    }

    function removeCategoryRow(i) {
      adminCategories.splice(i, 1);
      renderCategoriesAdmin();
    }

    async function saveCategories() {
      const rows = document.querySelectorAll('#categories-list > div[data-idx]');
      const list = [];
      rows.forEach(row => {
        const id = row.querySelector('.cat-id').value.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '');
        const oldId = row.querySelector('.cat-id').dataset.old;
        const label = row.querySelector('.cat-label').value.trim();
        const emoji = row.querySelector('.cat-emoji').value.trim();
        const sort = parseInt(row.querySelector('.cat-sort').value) || 0;
        if (id && label) list.push({ id, label, emoji, sort, _oldId: oldId });
      });
      if (!list.length) {
        showToast('Ajoute au moins une catégorie');
        return;
      }
      try {
        const res = await api('/api/admin/categories', {
          method: 'PUT',
          body: JSON.stringify({ categories: list })
        });
        adminCategories = res.categories;
        showToast('Catégories enregistrées ✨');
        renderCategoriesAdmin();
        fillCategorySelect();
      } catch (e) {
        showToast(e.message);
      }
    }

    document.addEventListener('change', async (e) => {
      if (e.target && e.target.id === 'f-file' && e.target.files && e.target.files[0]) {
        const file = e.target.files[0];
        if (file.size > 4 * 1024 * 1024) {
          showToast('Image trop lourde (max 4 Mo)');
          return;
        }
        const reader = new FileReader();
        reader.onload = async () => {
          try {
            showToast('Upload en cours…');
            const res = await api('/api/admin/upload', {
              method: 'POST',
              body: JSON.stringify({ image: reader.result, filename: file.name })
            });
            document.getElementById('f-image').value = res.url;
            document.getElementById('f-preview').innerHTML =
              `<img src="${res.url}" style="max-width:120px;border-radius:12px;margin-top:6px;" />`;
            showToast('Photo ajoutée ✨');
          } catch (err) {
            showToast(err.message);
          }
        };
        reader.readAsDataURL(file);
      }
    });

    async function saveProduct() {
      const id = document.getElementById('edit-id').value;
      const data = {
        name: document.getElementById('f-name').value.trim(),
        category: document.getElementById('f-category').value,
        price: parseFloat(document.getElementById('f-price').value),
        unit: document.getElementById('f-unit').value.trim() || '€',
        image_emoji: document.getElementById('f-emoji').value.trim() || '🎁',
        image_url: document.getElementById('f-image').value.trim() || null,
        description: document.getElementById('f-desc').value.trim(),
        active: document.getElementById('f-active').value === '1',
        sort_order: parseInt(document.getElementById('f-sort').value) || 0
      };
      if (!data.name || isNaN(data.price)) {
        showToast('Nom et prix obligatoires');
        return;
      }
      try {
        if (id) {
          await api(`/api/admin/products/${id}`, { method: 'PUT', body: JSON.stringify(data) });
          showToast('Produit mis à jour ✨');
        } else {
          await api('/api/admin/products', { method: 'POST', body: JSON.stringify(data) });
          showToast('Produit créé ✨');
        }
        resetForm();
        switchTab('products');
        loadProducts();
      } catch (e) {
        showToast(e.message);
      }
    }

    async function deleteProduct(id) {
      if (!confirm('Supprimer ce produit ?')) return;
      try {
        await api(`/api/admin/products/${id}`, { method: 'DELETE' });
        showToast('Produit supprimé');
        loadProducts();
      } catch (e) {
        showToast(e.message);
      }
    }

    async function loadOrders() {
      try {
        const orders = await api('/api/admin/orders');
        const list = document.getElementById('orders-list');
        if (orders.length === 0) {
          list.innerHTML = '<p style="color:var(--muted);text-align:center;padding:40px;">Aucune commande</p>';
          return;
        }
        list.innerHTML = orders.map(o => {
          const items = JSON.parse(o.items_json || '[]');
          const itemsStr = items.map(i => `${i.name} × ${i.qty}`).join(', ');
          return `
            <div class="card order-item">
              <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;">
                <strong>#${o.id}</strong>
                <span style="color:var(--gold);">${o.total.toFixed(2)} €</span>
              </div>
              <div style="font-size:0.85rem;color:var(--muted);margin:6px 0;">
                ${o.first_name || ''} ${o.username ? '@' + o.username : ''} · ${o.delivery_type === 'delivery' ? 'Livraison' : 'Retrait'}
              </div>
              <div style="font-size:0.9rem;">${escapeHtml(itemsStr)}</div>
              <div style="font-size:0.8rem;color:var(--muted);margin-top:6px;">
                ${new Date(o.created_at + 'Z').toLocaleString('fr-FR')}
                ${o.points_spent > 0 ? ' · 🎁 Points utilisés' : ''}
              </div>
            </div>
          `;
        }).join('');
      } catch (e) {
        showToast(e.message);
      }
    }

    function escapeHtml(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    
    async function loadSettings() {
      try {
        const s = await api('/api/admin/settings');
        document.getElementById('s-points-per-order').value = s.points_per_order;
        document.getElementById('s-points-for-reward').value = s.points_for_reward;
        document.getElementById('s-reward-label').value = s.reward_label;
      } catch (e) {
        showToast(e.message);
      }
    }

    async function saveSettings() {
      const data = {
        points_per_order: parseInt(document.getElementById('s-points-per-order').value) || 5,
        points_for_reward: parseInt(document.getElementById('s-points-for-reward').value) || 30,
        reward_label: document.getElementById('s-reward-label').value.trim() || '1 article offert'
      };
      try {
        await api('/api/admin/settings', { method: 'PUT', body: JSON.stringify(data) });
        showToast('Paramètres de fidélité enregistrés ✨');
      } catch (e) {
        showToast(e.message);
      }
    }

function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2800);
    }

    // Entrée = login
    document.getElementById('admin-password')?.addEventListener('keydown', e => {
      if (e.key === 'Enter') login();
    });
  </script>
</body>
</html>
